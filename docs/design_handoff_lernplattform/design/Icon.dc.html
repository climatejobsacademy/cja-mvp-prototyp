<body>
<x-dc>
<span style="display:block;flex-shrink:0;width:{{ sz }};height:{{ sz }};background:{{ col }};-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/{{ n }}.svg) center / contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/{{ n }}.svg) center / contain no-repeat"></span>

  }
}
</script>
