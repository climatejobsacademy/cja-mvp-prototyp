name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          # Liest die Node-Version aus package.json ("engines.node") — eine
          # Quelle der Wahrheit für CI und lokale Entwicklung.
          node-version-file: "package.json"
          cache: "npm"

      - name: Dependencies installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-Check
        run: npx tsc --noEmit

  rls-tests:
    needs: lint-and-types
    runs-on: ubuntu-latest
    # packages: read reicht, um mit dem automatischen GITHUB_TOKEN öffentliche
    # Images von ghcr.io angemeldet zu laden.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supabase CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Angemeldete Downloads statt anonymer: die anonymen Kontingente von
      # ghcr.io und public.ecr.aws haben rls-tests am 23.09. und 29.09.
      # mehrfach blockiert (toomanyrequests). setup-cli setzt die Registry
      # bereits auf ghcr.io.
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Supabase lokal starten (Postgres + Migrationen aus supabase/migrations)
        run: supabase start -x studio,edge-runtime,logflare,vector,mailpit,realtime,imgproxy,postgres-meta

      - name: RLS-Tests (pgTAP, supabase/tests/database)
        run: supabase test db

      - name: Supabase stoppen
        if: always()
        run: supabase stop
